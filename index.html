<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>Pickle Open Play</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<header><div><h1>🏓 Pickle Open Play</h1><p>Play hard • Have fun • Good vibes</p></div><button id="adminBtn" class="ghost">Organizer</button></header>
<main>
<section id="homeView"><div class="hero"><span class="pill">OPEN PLAY BOOKING</span><h2>Find your next game.</h2><p>Reserve a slot, bring your paddle, and play.</p></div><div class="toolbar"><input id="search" placeholder="Search open plays or venue…"><select id="levelFilter"><option value="">All levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>All Levels</option></select></div><div id="events" class="cards"></div></section>
<section id="bookingView" class="hidden"></section>
<section id="myView" class="hidden"><div class="sectionHead"><h2>My Booking</h2><button class="ghost" onclick="showHome()">← Back</button></div><div id="myBooking"></div></section>
<section id="adminView" class="hidden"><div class="sectionHead"><h2>Organizer Dashboard</h2><button class="ghost" onclick="showHome()">← Public Site</button></div><div class="stats" id="stats"></div><button class="primary wide" id="newEventBtn">＋ Create Open Play</button><div id="adminEvents" class="cards"></div></section>
</main>
<nav><button onclick="showHome()">🏠<span>Open Plays</span></button><button onclick="showMy()">🎟️<span>My Booking</span></button><button onclick="showAdmin()">⚙️<span>Organizer</span></button></nav>
<div id="modal" class="modal hidden"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<footer>by <strong>Puto Sikwati</strong></footer><script src="app.js"></script></body></html>
